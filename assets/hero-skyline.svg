<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1E1E"/>
      <stop offset="0.65" stop-color="#2B2B2B"/>
      <stop offset="1" stop-color="#2A2A2A"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BE3A48" stop-opacity="0"/>
      <stop offset="1" stop-color="#BE3A48" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>
  <rect width="1600" height="700" fill="url(#fade)"/>

  <!-- astre géométrique -->
  <g transform="translate(1245,150) rotate(45)" opacity="0.9">
    <rect x="-46" y="-46" width="92" height="92" fill="none" stroke="#BE3A48" stroke-width="1.2"/>
    <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#E9707C" stroke-width="1"/>
    <rect x="-10" y="-10" width="20" height="20" fill="#E9707C" opacity="0.85"/>
  </g>

  <!-- constellation discrète -->
  <g fill="#E9707C" opacity="0.55">
    <circle cx="180" cy="120" r="1.6"/><circle cx="420" cy="80" r="1.2"/><circle cx="700" cy="140" r="1.4"/>
    <circle cx="980" cy="90" r="1.2"/><circle cx="1430" cy="220" r="1.4"/><circle cx="90" cy="260" r="1.2"/>
    <circle cx="1530" cy="100" r="1.4"/><circle cx="610" cy="60" r="1"/>
  </g>

  <!-- skyline arrière-plan -->
  <g stroke="#BE3A48" stroke-width="1" fill="#282828" opacity="0.45">
    <rect x="-20" y="430" width="180" height="270"/>
    <rect x="200" y="460" width="120" height="240"/>
    <rect x="1180" y="440" width="150" height="260"/>
    <rect x="1480" y="420" width="160" height="280"/>
    <polygon points="340,470 400,410 460,470"/>
    <rect x="340" y="470" width="120" height="230"/>
  </g>

  <!-- ===== skyline principale ===== -->
  <g stroke="#BE3A48" stroke-width="1.6" fill="#262626">

    <!-- maisons à pignons flamands (rang de gauche) -->
    <g>
      <polygon points="120,520 170,455 220,520"/>
      <rect x="120" y="520" width="100" height="180"/>
      <rect x="138" y="545" width="26" height="34" fill="none" stroke-width="1.1"/>
      <rect x="176" y="545" width="26" height="34" fill="none" stroke-width="1.1"/>
      <rect x="156" y="630" width="30" height="70" fill="none" stroke-width="1.1"/>
    </g>
    <g>
      <path d="M240 520 L240 505 L252 505 L252 488 L264 488 L264 471 L276 471 L276 488 L288 488 L288 505 L300 505 L300 520 Z"/>
      <rect x="240" y="520" width="60" height="180"/>
      <rect x="252" y="545" width="22" height="30" fill="none" stroke-width="1.1"/>
      <rect x="252" y="600" width="22" height="30" fill="none" stroke-width="1.1"/>
    </g>
    <g>
      <polygon points="320,535 365,480 410,535"/>
      <rect x="320" y="535" width="90" height="165"/>
      <rect x="336" y="558" width="24" height="32" fill="none" stroke-width="1.1"/>
      <rect x="372" y="558" width="24" height="32" fill="none" stroke-width="1.1"/>
      <rect x="336" y="612" width="24" height="32" fill="none" stroke-width="1.1"/>
      <rect x="372" y="612" width="24" height="32" fill="none" stroke-width="1.1"/>
    </g>

    <!-- vieille bourse : fronton -->
    <g>
      <rect x="450" y="500" width="170" height="200"/>
      <polygon points="450,500 535,452 620,500"/>
      <rect x="470" y="525" width="30" height="42" fill="none" stroke-width="1.1"/>
      <rect x="520" y="525" width="30" height="42" fill="none" stroke-width="1.1"/>
      <rect x="570" y="525" width="30" height="42" fill="none" stroke-width="1.1"/>
      <rect x="470" y="595" width="30" height="42" fill="none" stroke-width="1.1"/>
      <rect x="570" y="595" width="30" height="42" fill="none" stroke-width="1.1"/>
      <rect x="515" y="610" width="40" height="90" fill="none" stroke-width="1.1"/>
      <polygon points="527,452 535,438 543,452" fill="#E9707C" stroke="none"/>
    </g>

    <!-- beffroi de l'hôtel de ville -->
    <g>
      <rect x="700" y="290" width="80" height="410"/>
      <rect x="712" y="250" width="56" height="40"/>
      <polygon points="712,250 740,196 768,250"/>
      <line x1="740" y1="196" x2="740" y2="168"/>
      <polygon points="734,168 740,154 746,168 740,182" fill="#E9707C" stroke="none"/>
      <rect x="718" y="320" width="16" height="26" fill="none" stroke-width="1.1"/>
      <rect x="746" y="320" width="16" height="26" fill="none" stroke-width="1.1"/>
      <rect x="718" y="380" width="16" height="26" fill="none" stroke-width="1.1"/>
      <rect x="746" y="380" width="16" height="26" fill="none" stroke-width="1.1"/>
      <rect x="718" y="440" width="16" height="26" fill="none" stroke-width="1.1"/>
      <rect x="746" y="440" width="16" height="26" fill="none" stroke-width="1.1"/>
      <circle cx="740" cy="270" r="11" fill="none" stroke-width="1.2"/>
      <line x1="740" y1="270" x2="740" y2="262"/>
      <line x1="740" y1="270" x2="746" y2="272"/>
      <line x1="700" y1="520" x2="780" y2="520" stroke-width="1.1"/>
    </g>

    <!-- immeuble haussmannien -->
    <g>
      <rect x="820" y="470" width="200" height="230"/>
      <line x1="820" y1="500" x2="1020" y2="500" stroke-width="1.1"/>
      <rect x="838" y="520" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="884" y="520" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="930" y="520" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="976" y="520" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="838" y="585" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="884" y="585" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="930" y="585" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="976" y="585" width="26" height="36" fill="none" stroke-width="1.1"/>
      <rect x="908" y="650" width="44" height="50" fill="none" stroke-width="1.1"/>
    </g>

    <!-- opéra : dôme -->
    <g>
      <rect x="1060" y="540" width="150" height="160"/>
      <path d="M1075 540 A60 60 0 0 1 1195 540" fill="#262626"/>
      <line x1="1135" y1="480" x2="1135" y2="462"/>
      <polygon points="1130,462 1135,450 1140,462 1135,472" fill="#E9707C" stroke="none"/>
      <rect x="1080" y="565" width="24" height="36" fill="none" stroke-width="1.1"/>
      <rect x="1123" y="565" width="24" height="36" fill="none" stroke-width="1.1"/>
      <rect x="1166" y="565" width="24" height="36" fill="none" stroke-width="1.1"/>
    </g>

    <!-- maisons de ville (rang de droite) -->
    <g>
      <polygon points="1250,545 1295,495 1340,545"/>
      <rect x="1250" y="545" width="90" height="155"/>
      <rect x="1266" y="568" width="24" height="32" fill="none" stroke-width="1.1"/>
      <rect x="1300" y="568" width="24" height="32" fill="none" stroke-width="1.1"/>
      <rect x="1280" y="630" width="30" height="70" fill="none" stroke-width="1.1"/>
    </g>
    <g>
      <path d="M1360 555 L1360 540 L1372 540 L1372 523 L1384 523 L1384 506 L1396 506 L1396 523 L1408 523 L1408 540 L1420 540 L1420 555 Z"/>
      <rect x="1360" y="555" width="60" height="145"/>
      <rect x="1372" y="578" width="22" height="30" fill="none" stroke-width="1.1"/>
      <rect x="1372" y="630" width="22" height="30" fill="none" stroke-width="1.1"/>
    </g>
  </g>

  <!-- sol -->
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#BE3A48" stroke-width="2"/>
</svg>
